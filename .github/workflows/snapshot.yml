name: Monthly register snapshot

# Takes the monthly snapshot of the USDA Local Food Directories on GitHub's
# servers, so the preservation archive does not depend on anyone remembering to
# run a script. See CHARTER.md section 3 for why this runs at all.
#
# Two ways it fires:
#   - automatically, 06:00 UTC on the 1st of each month
#   - manually, from the Actions tab: "Run workflow"
#
# IMPORTANT: GitHub automatically disables scheduled workflows after about 60
# days without repository activity, and commits made by this workflow may not
# reset that clock. GitHub emails the repository owner when it disables one, and
# re-enabling is a single button in the Actions tab. Keep a calendar reminder to
# glance at the Actions tab every couple of months — a preservation archive that
# stops silently is the one failure this programme cannot tolerate.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Take the snapshot
        env:
          # Free key from https://www.usdalocalfoodportal.com/fe/fregisterpublicapi/
          # Stored at Settings → Secrets and variables → Actions → New repository
          # secret, named LOCALFOOD_API_KEY. Never written into a file.
          #
          # The API is the only route a script can use: the Data Sharing page
          # builds its downloads in the browser and serves them from a blob:
          # URL, so there is no address for this workflow to fetch.
          LOCALFOOD_API_KEY: ${{ secrets.LOCALFOOD_API_KEY }}
        run: python code/01_snapshot_registers.py --route api

      - name: Show what the provenance log now holds
        run: python code/provenance.py

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit made."
          else
            git commit -m "Register snapshot $(date -u +%Y-%m)"
            git push
          fi
