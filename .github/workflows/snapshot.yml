name: Monthly register snapshot

# BACKSTOP ONLY — THIS IS NOT THE ARCHIVE'S CAPTURE.
#
# This calls the Local Food Directories API, which was measured on 18 September
# 2026 to return between 30% and 80% of each register depending on the
# directory, and about nine fields where the bulk download returns 85 to 264.
# Its output is written as *.partial.csv and says PARTIAL CAPTURE in its
# provenance line.
#
# The archive's capture is the browser download from
# https://www.usdalocalfoodportal.com/fe/datasharing/, folded in by hand with
# code/00_adopt_manual_snapshot.py. See CHARTER.md standard 9 and
# docs/SOURCES.md for the measurement.
#
# This job exists so that a month in which nobody clicks still leaves some
# record rather than none. It is not a substitute for the download, and nothing
# downstream should treat it as one.
#
# Two ways it fires:
#   - automatically, 06:00 UTC on the 1st of each month
#   - manually, from the Actions tab: "Run workflow"
#
# IMPORTANT: GitHub automatically disables scheduled workflows after about 60
# days without repository activity, and commits made by this workflow may not
# reset that clock. GitHub emails the repository owner when it disables one, and
# re-enabling is a single button in the Actions tab. Keep a calendar reminder to
# glance at the Actions tab every couple of months — a preservation archive that
# stops silently is the one failure this programme cannot tolerate.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Take the snapshot
        env:
          # Free key from https://www.usdalocalfoodportal.com/fe/fregisterpublicapi/
          # Stored at Settings → Secrets and variables → Actions → New repository
          # secret, named LOCALFOOD_API_KEY. Never written into a file.
          #
          # The API is the only route a script can use — the Data Sharing
          # page builds its downloads in the browser and serves them from a
          # blob: URL, so there is no address for this workflow to fetch — but
          # being the only automatable route did not make it a complete one.
          # See the header comment.
          LOCALFOOD_API_KEY: ${{ secrets.LOCALFOOD_API_KEY }}
        run: python code/01_snapshot_registers.py --route api

      - name: Show what the provenance log now holds
        run: python code/provenance.py

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit made."
          else
            git commit -m "Register snapshot $(date -u +%Y-%m)"
            git push
          fi
